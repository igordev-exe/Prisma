<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="cabecalho">
        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>
        
        <nav class="botoes">
            <a href="#"><img class="inicio" src="Inicio.png" alt="botao-inicio"></a>
            <a href="#"><img class="cursos" src="Cursos.png" alt="botao-cursos"></a>
            <a href="#"><img class="quemsomos" src="Quemsomos.png" alt="botao-quemsomos"></a>
            <a href="#"><img class="depoimentos" src="Depoimentos.png" alt="botao-depoimentos"></a>
            <a href="#"><img class="contatos" src="Contatos2.png" alt="botao-contatos"></a>
        </nav>
    </header>

    <main class="conteudo-principal">


        <div class="caixas">
            <img class="caixa" src="caixa.png" alt="Email">
            <img class="caixa3" src="caixa3.png" alt="Endereço">
            <img class="caixa2" src="caixa2.png" alt="Instagram">
            <img class="caixa4" src="caixa4.png" alt="Telefone">
        </div>

        
        <div class="personagens">
            <img src="Personagens.png" alt="personagens">
        </div> 

        <div class="botao-contate">
            <a href="https://www.google.com/?hl=pt_BR">
                <img src="Contate.png" alt="contate">
            </a>
        </div>

        
    </main>

</html>
